<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#203c34" />
    <title>유럽 · 오프라인</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; padding: 24px; display: grid; place-items: center; background: #f8f5f0; color: #1f2d29; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(420px, 100%); padding: 34px; border: 1px solid #d8ded9; border-radius: 22px; background: #fffdf9; text-align: center; box-shadow: 0 18px 45px rgba(32,60,52,.1); }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { margin: 20px 0 8px; font-size: 25px; }
      p { margin: 0; color: #6d7773; font-size: 14px; line-height: 1.65; }
      button { min-height: 44px; margin-top: 24px; padding: 0 20px; border: 0; border-radius: 11px; background: #203c34; color: white; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>현재 오프라인입니다</h1>
      <p>앱을 온라인에서 한 번 연 뒤 설치하면 일정과 장소를 인터넷 없이도 확인할 수 있습니다.</p>
      <button type="button" onclick="location.reload()">다시 열기</button>
    </main>
  </body>
</html>
